# Licence of every colour scheme in this repository, one entry per scheme.
#
# Each key is the scheme's display name: the file name in schemes/ without
# the extension or the `name:` of a YAML source in yaml/.
#
#   license  An SPDX licence identifier (https://spdx.org/licenses/). Use
#            `unknown` when no licence has been found and `nonfree` when the
#            licence does not allow redistribution.
#   source   Where the scheme or its licence comes from ("" if not known).
#   note     Optional, for example why a licence is unclear.
#
# The initial data comes from Jan200101's research in
# https://github.com/mbadolato/iTerm2-Color-Schemes/issues/638 and is still to
# be checked by the maintainers. Schemes added after that research are
# `unknown` unless their licence is documented.
#
# New schemes need an entry here: tools/check_licenses.py fails without one.
# `python gen.py --redistributable -o <dir>` generates every scheme except
# those marked `unknown` or `nonfree` into <dir>.

