# Higher-contrast companion to Dracula+ (original by jos3s).
# Leaves the existing Dracula+ scheme untouched — see iTerm2-Color-Schemes #566.
# Tuned for Terminal Themes High Contrast (AAA ≥7:1 on FG + Ansi 0–15 vs BG)
# and preferably CVD-friendly (AA ≥4.5 under protanopia/deuteranopia/tritanopia).
name: "Dracula+ High Contrast"
